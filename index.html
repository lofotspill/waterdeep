<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DM-skjerm Waterdeep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Cinzel:wght@600&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: tre smale glasskort midt på siden. Valuta og terninger | kamp | bank. Pastell Waterdeep ved skumring. */
  --ink: #2e2547;
  --muted: #6c6188;
  --glass: rgba(255,255,255,.34);
  --glass2: rgba(255,255,255,.58);
  --edge: rgba(255,255,255,.72);
  --accent: #8f63dc;
  --accent2: #d5679f;
  --good: #2f9a72;
  --bad: #d0476a;
  --display: 'Cinzel', Georgia, serif;
  --body: 'Quicksand', system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: linear-gradient(#a99be0, #f6b9d2 60%, #ffd8c5);
  color: var(--ink);
  font-family: var(--body);
  font-weight: 500;
  font-size: 14px;
  display: flex;
  flex-direction: column;
}
.bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
.bg svg { width: 100%; height: 100%; display: block; }
.moon { --m: calc((100vw - min(100vw, 1120px)) / 2 + 8px); --w: clamp(0px, calc(var(--m) - 28px), 96px);
  position: absolute; top: 74px; left: calc((var(--m) - var(--w)) / 2); width: var(--w); aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(circle at 36% 38%, rgba(220,200,185,.65) 0 8%, transparent 9%), radial-gradient(circle at 64% 64%, rgba(220,200,185,.5) 0 6%, transparent 7%), #fff6e6;
  box-shadow: 0 0 40px 22px rgba(255,243,223,.5), 0 0 110px 60px rgba(255,243,223,.22); }
@media (max-width: 960px) { .moon { display: none; } }
button, input, select { font: inherit; color: inherit; }
.top {
  width: 100%; max-width: 1120px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 14px 16px 8px;
}
.top { position: relative; justify-content: flex-end; min-height: 52px; }
.brand { position: absolute; left: 0; right: 0; top: 14px; text-align: center; pointer-events: none; }
.brand h1 { font-family: var(--display); font-size: 18px; margin: 0; letter-spacing: .08em; color: #fff; line-height: 28px; text-shadow: 0 1px 10px rgba(60,40,110,.45); }
.brand p { margin: 0; color: rgba(255,255,255,.9); font-size: 12px; text-shadow: 0 1px 8px rgba(60,40,110,.4); }
.tools { display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; width: 272px; }
@media (max-width: 960px) { .tools { width: auto; } }
.status[hidden] { display: none; }
.status { font-size: 12px; color: var(--muted); padding: 4px 11px; border-radius: 999px; background: var(--glass2); border: 1px solid var(--edge); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.status.ok { color: var(--good); }
.status.bad { color: var(--bad); }
main {
  flex: 1; min-height: 0; width: 100%; max-width: 1120px; margin: 0 auto;
  display: grid; grid-template-columns: 236px minmax(0, 1fr) 272px; grid-template-rows: minmax(0, 1fr) 312px; align-items: stretch;
  gap: 12px; padding: 4px 16px 16px;
}
body.loading main { opacity: .75; }
main > .widget, main > .col { min-height: 0; max-height: none; }
.g-notes { grid-area: 1 / 1; } .g-init { grid-area: 1 / 2; } .g-bank { grid-area: 1 / 3; }
.g-left2 { grid-area: 2 / 1; } .g-recap { grid-area: 2 / 2; } .g-rules { grid-area: 2 / 3; }
#w-npc { flex-shrink: 0; }
#w-conv { flex: 1 1 auto; }
.g-recap, .g-rules { overflow: hidden; }
.recap { overflow: auto; padding-right: 4px; scrollbar-width: thin; }
.recap p { margin: 0 0 7px; font-size: 13px; line-height: 1.45; }
.recap p:last-child { margin-bottom: 0; }
.col { display: flex; flex-direction: column; gap: 12px; min-height: 0; max-height: 100%; }
.widget {
  background: linear-gradient(145deg, rgba(255,255,255,.55), rgba(255,255,255,.22));
  backdrop-filter: blur(22px) saturate(1.6); -webkit-backdrop-filter: blur(22px) saturate(1.6);
  border: 1px solid var(--edge); border-radius: 26px;
  padding: 12px 14px; display: flex; flex-direction: column; min-height: 0; max-height: 100%;
  box-shadow: 0 10px 30px rgba(70,50,120,.22), inset 0 1px 0 rgba(255,255,255,.85), inset 0 -1px 0 rgba(255,255,255,.25);
}
.widget h2 { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px 2px; font-weight: 700; }
.wbody { overflow: auto; min-height: 0; flex: 0 1 auto; display: flex; flex-direction: column; gap: 8px; padding: 4px 6px 4px 4px; margin: -4px -4px -4px -4px; scrollbar-width: thin; scrollbar-color: rgba(120,100,170,.4) transparent; }
input[type=text], input[type=number], select {
  background: rgba(255,255,255,.55); border: 1px solid rgba(255,255,255,.85); border-radius: 14px;
  padding: 6px 10px; min-width: 0; width: 100%;
  box-shadow: inset 0 1px 3px rgba(70,50,120,.12);
}
input::placeholder { color: #9b90b5; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn {
  background: rgba(255,255,255,.55); border: 1px solid rgba(255,255,255,.85); border-radius: 14px;
  padding: 6px 12px; cursor: pointer; white-space: nowrap; font-weight: 600;
  box-shadow: 0 2px 8px rgba(70,50,120,.12), inset 0 1px 0 rgba(255,255,255,.9);
}
.btn:hover { background: rgba(255,255,255,.8); }
.btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border-color: rgba(255,255,255,.6); }
.btn.primary:hover { filter: brightness(1.07); background: linear-gradient(135deg, var(--accent), var(--accent2)); }
.btn.small { padding: 3px 9px; font-size: 12px; border-radius: 12px; }
.btn.ghost { background: transparent; box-shadow: none; border-color: transparent; color: #fff; text-shadow: 0 1px 6px rgba(60,40,110,.4); }
.btn.ghost:hover { background: rgba(255,255,255,.25); }
.wbody .btn.ghost { color: var(--muted); text-shadow: none; }
.btn.danger.armed { background: var(--bad); color: #fff; border-color: var(--bad); }
.row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.row > .grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); font-size: 12px; }
.msg { font-size: 12px; min-height: 16px; color: var(--muted); }
.msg.err { color: var(--bad); }
.msg.ok { color: var(--good); }

/* valuta */
.convin { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: center; }
.units { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; }
.unit { position: relative; cursor: pointer; }
.unit input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.unit span { display: flex; align-items: center; justify-content: center; gap: 3px; min-width: 40px; padding: 2px 6px; border-radius: 10px; background: rgba(255,255,255,.45); border: 1px solid rgba(255,255,255,.8); font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--muted); }
.unit input:checked + span { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
.unit input:checked + span::before { content: "✓"; }
.unit input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 1px; }
.coinrows { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.coinrow { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; background: rgba(255,255,255,.45); border: 1px solid rgba(255,255,255,.8); border-radius: 16px; padding: 5px 11px; }
.coinrow b { font-size: 11px; letter-spacing: .1em; color: var(--muted); }
.coinrow span { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; text-align: right; }
.split { font-size: 12px; color: var(--muted); }
.split b { color: var(--ink); }

/* katalog */
.cattiles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.cattile { text-align: left; cursor: pointer; background: rgba(255,255,255,.5); border: 1px solid rgba(255,255,255,.85); border-radius: 16px; padding: 8px 10px; box-shadow: 0 2px 8px rgba(70,50,120,.1); }
.cattile:hover { background: rgba(255,255,255,.85); }
.cattile strong { display: block; font-size: 14px; }
.cattile small { color: var(--muted); font-size: 11px; }
.cattitle { font-size: 14px; }
.catbar { flex-wrap: wrap; align-items: center; }
.sortsel { width: auto; margin-left: auto; padding: 3px 8px; font-size: 12px; }
.itembtn { width: 100%; text-align: left; cursor: pointer; font: inherit; color: inherit; }
.itembtn:hover, .itembtn.sel { background: rgba(255,255,255,.85); }
.price { white-space: nowrap; font-variant-numeric: tabular-nums; font-size: 13px; }
.catlist { max-height: 36vh; overflow: auto; }
.catform { display: grid; gap: 5px; margin-top: 6px; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.tab { background: rgba(255,255,255,.4); border: 1px solid rgba(255,255,255,.8); border-radius: 999px; padding: 3px 12px; cursor: pointer; font-weight: 600; font-size: 13px; }
.tab[aria-pressed=true] { background: rgba(255,255,255,.9); color: var(--accent); box-shadow: 0 2px 8px rgba(70,50,120,.15); }
.total { font-size: 22px; font-weight: 700; }
.total small { font-size: 12px; color: var(--muted); font-weight: 500; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
.tile { background: rgba(255,255,255,.45); border: 1px solid rgba(255,255,255,.8); border-radius: 16px; padding: 3px 4px 4px; text-align: center; }
.tile label { font-size: 10px; letter-spacing: .12em; color: var(--muted); display: block; font-weight: 700; }
.tile input { background: transparent; border: 0; box-shadow: none; text-align: center; font-size: 16px; font-weight: 700; padding: 0; font-variant-numeric: tabular-nums; }
.sub { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 4px 0 0 2px; font-weight: 700; }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.item { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,.45); border: 1px solid rgba(255,255,255,.8); border-radius: 14px; padding: 3px 8px; }
.item .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.item .nm em { display: block; font-style: normal; color: var(--muted); font-size: 11px; }
.item .q { min-width: 26px; text-align: center; font-variant-numeric: tabular-nums; font-size: 13px; }
.log { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 2px; font-size: 12px; color: var(--muted); }
.log time { opacity: .7; margin-right: 6px; }
details > summary { cursor: pointer; color: var(--muted); font-size: 12px; font-weight: 600; }

/* npc og ark */
.nlist[hidden] { display: none; }
.npcdrop { overflow-y: scroll; overscroll-behavior: contain; }
.npcdrop::-webkit-scrollbar { width: 10px; }
.npcdrop::-webkit-scrollbar-track { background: rgba(140,110,200,.12); border-radius: 8px; margin: 6px 0; }
.npcdrop::-webkit-scrollbar-thumb { background: rgba(120,90,190,.55); border-radius: 8px; border: 2px solid rgba(255,255,255,.6); }
.npcdrop { position: fixed; z-index: 99999; max-height: 190px; padding: 6px; background: rgba(255,255,255,.88); backdrop-filter: blur(22px) saturate(1.6); -webkit-backdrop-filter: blur(22px) saturate(1.6); border: 1px solid var(--edge); border-radius: 16px; box-shadow: 0 12px 34px rgba(70,50,120,.3); scrollbar-width: thin; }
.nlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; max-height: 210px; overflow: auto; }
.nitem { display: block; width: 100%; text-align: left; cursor: pointer; background: rgba(255,255,255,.45); border: 1px solid rgba(255,255,255,.8); border-radius: 14px; padding: 4px 10px; font-weight: 600; }
.nitem.secret { color: var(--muted); letter-spacing: .12em; }
.ico { display: inline-flex; vertical-align: middle; margin-right: 6px; }
.btn .ico { margin: 0; }
.nitem.secret { display: flex; align-items: center; }
.coderow { display: flex; align-items: center; gap: 4px; }
.coderow .ico { margin: 0 2px 0 4px; color: var(--muted); }
.codein { flex: 1; min-width: 0; -webkit-text-security: disc; text-security: disc; }
.codein.bad { border-color: var(--bad); box-shadow: 0 0 0 2px rgba(179,38,46,.25); }
.nitem:hover { background: rgba(255,255,255,.8); }
.nitem small { display: block; color: var(--muted); font-size: 11px; font-weight: 500; }
.sheet {
  position: fixed; width: min(400px, calc(100vw - 20px)); max-height: min(80vh, 780px); display: flex; flex-direction: column;
  background: linear-gradient(145deg, rgba(255,255,255,.9), rgba(255,255,255,.74));
  backdrop-filter: blur(26px) saturate(1.6); -webkit-backdrop-filter: blur(26px) saturate(1.6);
  border: 1px solid var(--edge); border-radius: 22px;
  box-shadow: 0 18px 50px rgba(50,30,100,.38), inset 0 1px 0 rgba(255,255,255,.9);
}
.sh-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 12px 6px 16px; cursor: grab; user-select: none; touch-action: none; }
.sh-head.grab { cursor: grabbing; }
.sh-head strong { font-family: var(--display); font-size: 15px; letter-spacing: .02em; }
.sh-body { overflow: auto; padding: 0 16px 8px; min-height: 0; flex: 1 1 auto; }
.sh-body p { margin: 4px 0; line-height: 1.38; font-size: 13px; }
.sh-body textarea { width: 100%; min-height: 300px; resize: vertical; font: 12px/1.4 ui-monospace, Menlo, monospace; background: rgba(255,255,255,.6); border: 1px solid rgba(255,255,255,.9); border-radius: 14px; padding: 8px 10px; box-shadow: inset 0 1px 3px rgba(70,50,120,.12); color: var(--ink); }
.sh-bar { display: flex; gap: 6px; padding: 4px 16px 12px; flex-wrap: wrap; }
h4.sec { font-family: var(--display); font-size: 13px; letter-spacing: .04em; color: var(--accent); margin: 10px 0 3px; padding-bottom: 2px; border-bottom: 1px solid rgba(143,99,220,.3); }
table.abil { width: 100%; border-collapse: collapse; text-align: center; margin: 8px 0; }
table.abil th { font-size: 10px; letter-spacing: .1em; color: var(--muted); font-weight: 700; padding: 2px 0; }
table.abil td { font-size: 13px; font-weight: 700; padding: 2px 0; }

/* kamp */
.cbar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.round { font-size: 15px; font-weight: 700; color: var(--accent); margin-right: 2px; }
details.addwrap { background: rgba(255,255,255,.3); border: 1px solid rgba(255,255,255,.7); border-radius: 16px; padding: 4px 11px; }
details.addwrap[open] { padding-bottom: 8px; }
.addform { display: grid; grid-template-columns: minmax(80px, 2fr) 46px 46px 46px 54px 46px 92px auto; gap: 5px; align-items: end; margin-top: 6px; }
.addform label { display: grid; gap: 1px; font-size: 10px; letter-spacing: .06em; color: var(--muted); font-weight: 700; text-transform: uppercase; }
.addform input, .addform select { padding: 5px 7px; }
.clist { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
.cb {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  background: rgba(255,255,255,.45); border: 1px solid rgba(255,255,255,.8); border-radius: 18px; padding: 4px 10px 4px 14px;
  position: relative;
}
.cb::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 4px; border-radius: 4px; background: #bbb; }
.cb.pc::before { background: #3fb5a3; }
.cb.npc::before { background: #3fb5a3; }
.cb.monster { background: rgba(140,100,205,.30); border-color: rgba(185,155,240,.75); }
.cb.monster::before { background: #8a5fd0; }
.cb.monster.active { background: rgba(170,135,230,.55); }
.cb.active { background: rgba(255,255,255,.85); border-color: var(--accent); box-shadow: 0 4px 16px rgba(143,99,220,.3); }
.cb.dead { opacity: .5; filter: grayscale(1); }
.cb.dead .nm strong { text-decoration: line-through; color: var(--muted); }
.cb .init { width: 46px; text-align: center; font-size: 16px; font-weight: 700; padding: 3px; }
.cb .nm { flex: 1; min-width: 96px; }
.cb .nm strong { font-size: 15px; }
.cb .nm small { color: var(--muted); margin-left: 6px; font-size: 11px; }
.nm1 { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.tag { border: 0; background: rgba(120,90,190,.16); color: #5a3da0; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; border-radius: 999px; padding: 1px 7px; cursor: pointer; }
.tag.monster { background: rgba(110,70,190,.28); }
.conc { width: 20px; height: 20px; border-radius: 50%; border: 1px solid rgba(120,100,170,.35); background: rgba(255,255,255,.4); color: var(--muted); font-size: 11px; font-weight: 700; line-height: 1; padding: 0; cursor: pointer; }
.conc.on { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border-color: rgba(255,255,255,.7); }
.chips { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 3px; }
.chip { border: 0; background: rgba(208,71,106,.16); color: #a3304f; font-size: 10px; font-weight: 700; border-radius: 999px; padding: 1px 7px; cursor: pointer; }
.ds { display: flex; align-items: center; gap: 4px; margin-top: 3px; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.ds span { margin-right: 2px; white-space: nowrap; }
.ds i { width: 6px; }
.dot { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid rgba(120,100,170,.5); background: rgba(255,255,255,.5); padding: 0; cursor: pointer; }
.dot.ok.on { background: var(--good); border-color: var(--good); }
.dot.bad.on { background: var(--bad); border-color: var(--bad); }
.condbtn { min-width: 30px; padding: 2px 6px; }
.condbtn.on { background: rgba(208,71,106,.18); color: #a3304f; border-color: rgba(208,71,106,.4); }
.pop { position: fixed; z-index: 100000; width: 340px; max-width: calc(100vw - 16px); overflow: auto; display: grid; gap: 8px; align-content: start;
  background: rgba(255,255,255,.84); backdrop-filter: blur(22px) saturate(1.6); -webkit-backdrop-filter: blur(22px) saturate(1.6);
  border: 1px solid var(--edge); border-radius: 20px; padding: 10px; box-shadow: 0 14px 40px rgba(70,50,120,.32); }
.pop .nlist { max-height: 320px; }
.addform[hidden] { display: none; }
.pop .addform { grid-template-columns: repeat(3, 1fr); margin-top: 0; }
.pop .addform .wide { grid-column: 1 / -1; }
.pop .cnt { width: 62px; flex: none; }
.addpop .row { flex-wrap: nowrap; }
.condgrid { display: flex; flex-wrap: wrap; gap: 5px; }
.condopt { cursor: pointer; border: 1px solid rgba(255,255,255,.85); background: rgba(255,255,255,.55); border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600; }
.condopt:hover { background: rgba(255,255,255,.9); }
.condopt.on { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border-color: rgba(255,255,255,.6); }
.stats { display: flex; align-items: flex-end; gap: 8px; flex-wrap: wrap; }
.mf { display: grid; gap: 1px; justify-items: center; text-align: center; font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.mf span { padding: 0; width: 100%; text-align: center; }
.cb input[type=number]::-webkit-inner-spin-button, .cb input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.cb input[type=number] { -moz-appearance: textfield; appearance: textfield; }
.cb input.s { width: 48px; text-align: center; padding: 2px 4px; font-size: 13px; }
.cb input.s.wide { width: 62px; }
.hpp { display: inline-flex; align-items: center; gap: 3px; }
.hpp i { font-style: normal; color: var(--muted); }
.hit { display: inline-flex; align-items: center; gap: 3px; }
.btn.xdel { color: var(--bad); font-weight: 700; }
.btn.xdel:hover { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn.sq { padding: 2px 0; width: 26px; text-align: center; }
.empty { color: var(--muted); padding: 14px 6px; text-align: center; }

/* økt, huskelapper, regler */
.clock { padding: 0 4px; }
.ctime { font-size: 22px; font-variant-numeric: tabular-nums; }
.cdate { font-size: 14px; color: var(--ink); font-weight: 700; }
.notelist { display: grid; gap: 6px; }
.nhdr { display: grid; gap: 6px; }
.note { border-radius: 14px; padding: 4px 8px 6px; border: 1px solid rgba(255,255,255,.85); box-shadow: 0 2px 8px rgba(70,50,120,.1); }
.note.c0 { background: rgba(255,238,170,.62); }
.note.c1 { background: rgba(255,200,222,.6); }
.note.c2 { background: rgba(196,238,214,.62); }
.note.c3 { background: rgba(200,218,255,.62); }
.nhead { display: flex; align-items: center; justify-content: space-between; }
.nhead small { color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .06em; }
.nhead .btn { width: 22px; height: 22px; padding: 0; line-height: 1; font-size: 13px; }
.ntext { width: 100%; resize: none; border: 0; background: transparent; font: inherit; font-size: 13px; line-height: 1.35; padding: 0; overflow: hidden; color: var(--ink); }
.ntext:focus { outline: none; }
.rulehead { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; width: 100%; text-align: left; cursor: pointer; background: none; border: 0; padding: 2px 0; }
.rulehead em { font-style: normal; color: var(--muted); font-size: 11px; }
.item.rule { display: block; padding: 2px 10px; }
.item.rule:hover, .item.rule.open { background: rgba(255,255,255,.8); }
.rtext { margin: 0 0 4px; font-size: 12px; line-height: 1.4; color: var(--ink); }
#w-rules .cattile, #w-bank .cattile { padding: 5px 9px; border-radius: 14px; }
#w-rules .cattile strong, #w-bank .cattile strong { font-size: 13px; }
#w-rules .cattiles, #w-bank .cattiles { gap: 5px; }

@media (max-width: 960px) {
  html, body { height: auto; min-height: 100%; }
  .brand { position: static; width: 100%; order: -1; }
  main { grid-template-columns: 1fr; }
  .wbody { overflow: visible; }
  main { align-items: stretch; }
  .widget, .col { max-height: none; }
  main { grid-template-rows: none; }
  main > .widget, main > .col { grid-area: auto; }

  .addform { grid-template-columns: repeat(3, 1fr); }
  .addform .wide { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: no-preference) {
  .btn, .tab { transition: background .15s, filter .15s; }
}

<script>
window.addEventListener('error', e => { const el = document.getElementById('errs'); if (el) el.textContent = ' Feil: ' + (e.message || '?') + ' (linje ' + (e.lineno || '?') + ')'; });
window.addEventListener('unhandledrejection', e => { const el = document.getElementById('errs'); if (el) el.textContent = ' Feil: ' + ((e.reason && e.reason.message) || e.reason || '?'); });
const DBG = []; const t0 = Date.now();
const dbg = m => { DBG.push(((Date.now() - t0) / 1000).toFixed(1) + 's ' + m); if (DBG.length > 60) DBG.shift(); const el = document.getElementById('dbgout'); if (el && el.offsetParent !== null) el.textContent = DBG.join('\n'); };
/*LOGIC-START*/
const VAL = { cp: 1, sp: 10, gp: 100, pp: 1000 };
const ORDER = ['cp', 'sp', 'gp', 'pp'];
const ALIAS = { cp: 'cp', kobber: 'cp', sp: 'sp', 'sølv': 'sp', solv: 'sp', gp: 'gp', gull: 'gp', pp: 'pp', platina: 'pp' };

function parseMoney(text, defaultUnit) {
  let src = String(text).toLowerCase().replace(/[−–—]/g, '-').replace(/\bog\b/g, '+');
  if (!src.trim()) return { error: 'Skriv et beløp, for eksempel 18 gp.' };
  const re = /([+\-])?\s*(\d+(?:[.,]\d+)?)\s*([a-zæøå]*)/g;
  const leftover = src.replace(re, '').replace(/[\s,;+]/g, '');
  const matches = [...src.matchAll(re)];
  if (!matches.length) return { error: 'Skriv et beløp, for eksempel 18 gp.' };
  if (leftover) return { error: 'Forstod ikke «' + leftover + '».' };
  const units = { cp: 0, sp: 0, gp: 0, pp: 0 };
  let assumed = false;
  for (const m of matches) {
    const sign = m[1] === '-' ? -1 : 1;
    const num = parseFloat(m[2].replace(',', '.'));
    let unit;
    if (m[3]) {
      unit = ALIAS[m[3]];
      if (!unit) return { error: 'Ukjent enhet «' + m[3] + '». Bruk cp, sp, gp eller pp.' };
    } else { unit = defaultUnit || 'gp'; assumed = true; }
    if (Number.isInteger(num)) units[unit] += sign * num;

const parseHM = t => {
  const m = /^\s*(\d{1,2})\s*[:.]?\s*(\d{2})?\s*$/.exec(String(t == null ? '' : t));
  if (!m) return null;
  const hh = +m[1], mm = m[2] == null ? 0 : +m[2];
  return hh > 23 || mm > 59 ? null : hh * 60 + mm;
};
const fmtHM = min => String(Math.floor(min / 60)).padStart(2, '0') + ':' + String(min % 60).padStart(2, '0');
function sessionState(now, startMin, endMin) {
  const dur = ((endMin - startMin + 1440) % 1440) || 1440;
  const at = (d, min) => { const x = new Date(now); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() + d); x.setMinutes(min); return x.getTime(); };
  for (const d of [-1, 0]) {
    const s = at(d, startMin), e = s + dur * 60000;
    if (now >= s && now < e) return { phase: 'active', left: e - now, pct: (now - s) / (e - s) };
  }
  const prevEnd = at(-1, startMin) + dur * 60000;
  if (now >= prevEnd && now - prevEnd < 12 * 3600000) return { phase: 'over', left: 0, pct: 1 };
  const s0 = at(0, startMin);
  if (now < s0) return { phase: 'before', left: s0 - now, pct: 0 };
  return { phase: 'over', left: 0, pct: 1 };
}
const fmtLeft = ms => {

const newCoins = () => ({ cp: 0, sp: 0, gp: 0, pp: 0 });
const DEFAULTS = {
  combat: () => ({ round: 1, active: null, running: false, seq: 0, list: [] }),
  notes: () => ({ start: '18:00', end: '21:00', items: [] })
};
const LOCKED_PCS = [{ id: 'pc-sariel', name: 'Sariel' }, { id: 'pc-ekko', name: 'Ekko' }, { id: 'pc-andoran', name: 'Andoran' }, { id: 'pc-marcus', name: 'Marcus' }];
const REMOVED_IDS = ['pc-tina'];
const NORM = {
  catalog: normCatalog,
  npcs(d) {
    const n = Object.assign({ list: [] }, d || {});
    n.list = Array.isArray(n.list) ? n.list.filter(x => x && x.id && typeof x.md === 'string') : [];
    n.seeded = Array.isArray(n.seeded) ? n.seeded : [];
    SEED_NPCS.forEach(sd => {
      if (n.seeded.includes(sd.id)) return;
      n.seeded.push(sd.id);
      if (!n.list.some(x => x.id === sd.id)) n.list.push({ id: sd.id, md: sd.md });
    });
    return n;
  },
  notes(d) {
    const n = Object.assign(DEFAULTS.notes(), d || {});
    const a = parseHM(n.start), b = parseHM(n.end);
    n.start = fmtHM(a == null ? 18 * 60 : a); n.end = fmtHM(b == null ? 21 * 60 : b);
    n.items = Array.isArray(n.items) ? n.items.filter(x => x && x.id && typeof x.text === 'string') : [];
    delete n.next;
    delete n.recap;
    return n;
  },
  combat(d) {
    const c = Object.assign(DEFAULTS.combat(), d || {});
    c.list = Array.isArray(c.list) ? c.list : [];
    delete c.ui;
    c.list.forEach(x => { if (!Array.isArray(x.conds)) x.conds = []; });
    LOCKED_PCS.forEach((p, i) => {
      const ex = c.list.find(x => x.id === p.id);
      if (ex) ex.locked = true;
      else c.list.push({ id: p.id, n: i + 1, name: p.name, kind: 'pc', init: null, hp: 0, max: 0, ac: p.ac == null ? null : p.ac, conds: [], locked: true });
    });
    c.list = c.list.filter(x => !REMOVED_IDS.includes(x.id));
    c.seq = Math.max(c.seq || 0, LOCKED_PCS.length);
    return c;
  }
};
const S = { catalog: NORM.catalog(), combat: NORM.combat(), npcs: NORM.npcs(), notes: NORM.notes() };
const KEYS = ['catalog', 'combat', 'npcs', 'notes'];

/* ---------- lagring ---------- */
let db = null, downloads = null;
const loaded = {}, saveTimers = {}, inflight = {}, dirty = {};
function setStatus(kind) {
  const el = $('#status');
  el.className = 'status';
  const t = { saving: 'Lagrer…', saved: 'Lagret', saved0: 'Lagret', err: 'Kunne ikke lagre', slow: 'Får ikke kontakt med lagringen' }[kind] || '';
  el.textContent = t;
  el.hidden = !(kind === 'err' || kind === 'slow');
  if (kind === 'saved' || kind === 'saved0') el.classList.add('ok');
  if (kind === 'err' || kind === 'slow') el.classList.add('bad');
}
function queueSave(key) {
  if (!db || !loaded[key]) return;
  clearTimeout(saveTimers[key]);
  setStatus('saving');
  saveTimers[key] = setTimeout(() => flush(key), 300);
}
async function flush(key) {
  dbg('flush ' + key + (inflight[key] ? ' (venter)' : ''));
  saveTimers[key] = null;
  if (inflight[key]) { dirty[key] = true; return; }
  inflight[key] = true;
  try {
    S[key].rev = Date.now();
    if (key === 'combat') dbg('sender: ' + S.combat.list.map(x => x.name + '=' + x.init).join(' '));
    await db.doc('dm/' + key).set(JSON.parse(JSON.stringify(S[key])));
    setStatus('saved');
  } catch (e) { setStatus('err'); }
  inflight[key] = false;
  if (dirty[key]) { dirty[key] = false; flush(key); }
}
let heldAdopt = null;
const typingInCombat = () => { const a = document.activeElement; return !!(a && a.tagName === 'INPUT' && a.closest && a.closest('#combat')); };
const typingInNotes = () => { const a = document.activeElement; return !!(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA') && a.closest && a.closest('#notes')); };
document.addEventListener('focusout', () => setTimeout(() => { if (!typingInCombat()) heldAdopt = null; }, 0));
function adopt(key, data) {
  dbg('adopt ' + key + ' rev=' + (data && data.rev) + ' lokal=' + (S[key].rev || 0) + (key === 'combat' && typingInCombat() ? ' HOLDT' : ''));
  if (key === 'combat' && typingInCombat()) { heldAdopt = { data }; return; }
  if (key === 'notes' && typingInNotes()) return;
  if (data && (Number.isFinite(data.rev) ? data.rev : 0) < (S[key].rev || 0)) return; // gammelt øyeblikksbilde: lokal endring er nyere
  const next = NORM[key](data);
  if (JSON.stringify(next) === JSON.stringify(S[key])) return;
  S[key] = next;
  if (key === 'catalog') renderCatalog();
  else if (key === 'npcs') { renderNpc(); renderSheets(); }
  else if (key === 'notes') renderNotes();
  else renderCombat();
}
const unlock = () => document.body.classList.remove('loading');

let convInput, convOut, convMsg, convUnit = 'gp';
function initConv() {
  convInput = h('input', { type: 'text', value: '18', inputmode: 'decimal', autocomplete: 'off', spellcheck: 'false', 'aria-label': 'Beløp', placeholder: 'Beløp', oninput: updateConv });
  convOut = h('div', { class: 'coinrows' });
  convMsg = h('div', { class: 'msg' });
  const units = h('div', { class: 'units', role: 'radiogroup', 'aria-label': 'Mynttype' },
    ['pp', 'gp', 'sp', 'cp'].map(u => h('label', { class: 'unit' },
      h('input', { type: 'radio', name: 'unit', value: u, checked: u === convUnit, onchange: () => { convUnit = u; updateConv(); } }),
      h('span', {}, u.toUpperCase()))));
  $('#conv').replaceChildren(
    h('div', { class: 'convin' }, convInput, units),
    convOut, h('div', { class: 'split', id: 'conv-split' }), convMsg);
  updateConv();
}
function flashConv(text, kind) { convMsg.textContent = text; convMsg.className = 'msg ' + kind; }
function updateConv() {
  if (!convInput) return;
  const r = parseMoney(convInput.value, convUnit);
  convOut.replaceChildren();
  const sp = $('#conv-split');
  if (r.error) { flashConv(r.error, 'err'); sp.textContent = ''; return; }
  flashConv('', '');
  const dens = ['pp', 'gp', 'sp', 'cp'];
  for (const d of dens) convOut.append(h('div', { class: 'coinrow' }, h('b', {}, d.toUpperCase()), h('span', {}, nf.format(r.cp / VAL[d]))));
  const s = split(r.cp);
  const txt = dens.filter(d => s[d]).map(d => nf.format(s[d]) + ' ' + d).join(' · ') || '0 cp';
  sp.replaceChildren('Fordelt: ', h('b', {}, (r.cp < 0 ? '−' : '') + txt));
}

  const cats = CAT_ORDER.filter(c => items.some(x => x.cat === c)).concat([...new Set(items.map(x => x.cat))].filter(c => !CAT_ORDER.includes(c)));
  const q = catUi.q.trim().toLowerCase();

      if (e.key !== 'Enter') return;
      const t = e.target.value.trim(); if (!t) return;
      S.notes.items.unshift({ id: uid(), text: t, t: Date.now() });
      e.target.value = ''; queueSave('notes'); renderNotes();
    } });
  noteList = h('div', { class: 'notelist' });
  $('#notes').replaceChildren(h('div', { class: 'nhdr' }, h('div', { class: 'clock' }, clockD), add), noteList);
  tickClock(); setInterval(tickClock, 1000);
  renderNotes();
}
function renderNotes() {
  if (!noteList) return;
  const items = S.notes.items;
  noteList.replaceChildren(...(items.length ? items.map((n, i) => {
    const ta = h('textarea', { class: 'ntext', rows: '1', spellcheck: 'false', 'aria-label': 'Huskelapp', 'data-key': 'note-' + n.id,
      oninput: e => { n.text = e.target.value; fitNote(e.target); queueSave('notes'); } }, n.text);
    ta.value = n.text;
    return h('div', { class: 'note c' + (i % 4) },
      h('div', { class: 'nhead' }, h('small', {}, n.t ? new Date(n.t).toLocaleDateString('nb-NO', { day: '2-digit', month: '2-digit' }) : ''),
        h('button', { type: 'button', class: 'btn small sq xdel', title: 'Slett', 'aria-label': 'Slett huskelapp', onclick: () => { S.notes.items = S.notes.items.filter(x => x.id !== n.id); queueSave('notes'); renderNotes(); } }, '×')),
      ta);
  }) : [h('div', { class: 'muted' }, 'Ingen huskelapper ennå.')]));
  noteList.querySelectorAll('textarea').forEach(fitNote);
}

/* ---------- sikkerhetskopi ---------- */
function initBackup() {
  const file = $('#bk-file');
  $('#bk-import-slot').replaceChildren(twoStep('Erstatt filen', 'Erstatter alt. Velg fil', () => file.click(), 'small ghost'));
  $('#bk-export').addEventListener('click', async () => {
    if (!downloads) return;
    const payload = { format: 'dm-skjerm-v1', savedAt: new Date().toISOString(), catalog: S.catalog, combat: S.combat, npcs: S.npcs, notes: S.notes };
    try { await downloads.save({ filename: 'dm-skjerm-kopi-' + new Date().toISOString().slice(0, 10) + '.json', data: JSON.stringify(payload, null, 2) }); } catch (e) { /* avbrutt */ }
  });
  file.addEventListener('change', async () => {
    const f = file.files[0]; file.value = '';
    if (!f) return;
    try {
      const d = JSON.parse(await f.text());
      if (d.format !== 'dm-skjerm-v1') throw new Error('feil format');
      S.catalog = NORM.catalog(d.catalog); S.combat = NORM.combat(d.combat); S.npcs = NORM.npcs(d.npcs); if (d.notes) S.notes = NORM.notes(d.notes);
      KEYS.forEach(queueSave); renderAll();
    } catch (e) { setStatus('err'); $('#status').textContent = 'Filen kunne ikke leses'; }
  });
}

function renderAll() { renderCatalog(); renderCombat(); updateConv(); renderNpc(); renderSheets(); renderRules(); renderNotes(); renderRecap(); }

async function boot() {
  setTimeout(unlock, 3000);
  initConv(); initNpc(); initBackup(); initNotes();
  renderAll();
  if (typeof claude === 'undefined') { setStatus('off'); unlock(); return; }
  try { db = await claude.use('db'); downloads = await claude.use('downloads'); } catch (e) { db = null; }
  if (!downloads) $('#bk-export').hidden = true;
  if (!db) { setStatus('off'); unlock(); return; }
  let pending = KEYS.length;
  const timer = setTimeout(() => { unlock(); setStatus('slow'); }, 10000);
  KEYS.forEach(k => db.doc('dm/' + k).onSnapshot(s => {
    if (!s.metadata.fromCache && !loaded[k]) {
      loaded[k] = true;
      if (--pending === 0) { clearTimeout(timer); unlock(); setStatus('saved0'); }
    }
    dbg('snapshot ' + k + ' cache=' + s.metadata.fromCache + ' pending=' + s.metadata.hasPendingWrites + ' timer=' + !!saveTimers[k] + ' inflight=' + !!inflight[k]);
    if (s.metadata.hasPendingWrites || saveTimers[k] || inflight[k]) return;
    adopt(k, s.exists ? JSON.parse(JSON.stringify(s.data())) : null);
  }, () => { setStatus('err'); }));
}
boot();
</script>
